[project]
name = "radar-narrativas"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6",
    "python-dotenv>=1",
    # Fase 0 suma: sentence-transformers / onnxruntime, scikit-learn, umap-learn, hdbscan,
    # igraph + leidenalg, faiss-cpu, openai / anthropic
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=5",
    "transformers>=4.57",
    "torch>=2.15.0",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
]

[dependency-groups]
dev = ["pytest>=8"]
gemma = [
    "pillow>=13.0.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
