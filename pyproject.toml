[project]
name = "radar-narrativas"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6",
    "python-dotenv>=1",
    # Fase 0 suma: sentence-transformers / onnxruntime, scikit-learn, umap-learn, hdbscan,
    # igraph + leidenalg, faiss-cpu, openai / anthropic
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
