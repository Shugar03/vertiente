# Todos los parámetros acá. Nada de números mágicos en el código.
# Regla: nada atado a los temas de práctica. Cada valor indica el experimento que lo justifica (experimentos/).

seed: 42
interim_dir: interim
tz: "-03:00"

embeddings:
  modelo: intfloat/multilingual-e5-small   # E01/E02: misma pureza kNN que EmbeddingGemma 2 (0,998) y 6x más rápido
  batch: 256
  dispositivo: auto                         # auto | cpu | mps
  cache_dir: interim/cache_emb

narrativas:
  knn_k: 10
  resolucion: 2.0                           # E06: barrido 0.5–4; 2.0 mejor equilibrio ruido/postura
  acomp_min_dispersion: 5                   # respuesta corta que cuelga de >= 5 microgrupos = acompañamiento
  acomp_max_palabras: 4
  umbral_ruido: 0.01                        # respuestas por comentario del microgrupo (E04/E06)
  ruido_alfa: 0.02                          # E18: texto frecuente sin respuestas => ruido (umbral adaptativo)
  herencia_profundidad_max: 10
  origen_ventana_h: 3                       # tolerancia del puntaje = 3 h
  origen_minimo: 5
  origen_minimo_frac: 0.005                 # E37: el pico de origen se mide relativo al volumen de la narrativa
  # Modo degradado (E32): si casi no hay respuestas, narrativas solo por significado.
  min_tasa_respuestas: 0.03                 # en práctica la participación es ~0,25
  semantico_knn: 5
  semantico_min_frac_tamano: 0.0005

coordinacion:
  # E25: elegido por PROMEDIO y PEOR CASO sobre variantes de estrés (no por el set completo): media 23,2 / peor 21,4
  ventana_min: 30                           # sincronía alineada: misma publicación + narrativa + postura, <= 30 min
  min_sincronias: 2                         # repetición en >= 2 publicaciones distintas
  min_sincronia_norm: 0.1                   # fracción de publicaciones de la cuenta menos activa
  min_vecinos_comunes: 3                    # las operaciones forman triángulos; el azar genuino no
  min_tamano: 5
  min_densidad: 0.3
  fraccion_nucleo: 0.5                      # E30: rescate del núcleo k-core si la comunidad no es densa

llm:
  # Profesor opcional (radar/llm.py): 1 llamada por narrativa para decidir qué lado afirma + título.
  # Sin ANTHROPIC_API_KEY usa cache/llm/ (commiteada) y, si no hay, reglas locales. LLM_MODEL en .env lo sobreescribe.
  modelo: claude-opus-5-5
  precios_usd_por_millon:                   # para costo.json
    claude-opus-5-5: {in: 4.0, out: 20.0}
    claude-sonnet-5-5: {in: 2.0, out: 10.0}
    claude-haiku-5-5: {in: 0.10, out: 0.50}
  ejemplos_por_lado: 8
  min_confianza: 0.6
  timeout_s: 60
  reintentos: 3
  cache_dir: cache/llm

duckdb:
  memory_limit: 4GB
  max_temp: 8GB                             # tope de spill a disco (evita llenar el disco)
