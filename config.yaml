# Todos los parámetros acá. Nada de números mágicos en el código.
# Regla: nada atado a los temas de práctica. Cada valor indica el experimento que lo justifica (experimentos/).

seed: 42
interim_dir: interim
tz: "-03:00"

embeddings:
  modelo: intfloat/multilingual-e5-small   # E01/E02: misma pureza kNN que EmbeddingGemma 2 (0,998) y 6x más rápido
  batch: 256
  dispositivo: auto                         # auto | cpu | mps
  cache_dir: interim/cache_emb

narrativas:
  knn_k: 10
  resolucion: 2.0                           # E06: barrido 0.5–4; 2.0 mejor equilibrio ruido/postura
  acomp_min_dispersion: 5                   # respuesta corta que cuelga de >= 5 microgrupos = acompañamiento
  acomp_max_palabras: 4
  umbral_ruido: 0.01                        # respuestas por comentario del microgrupo (E04/E06)
  ruido_alfa: 0.02                          # E18: texto frecuente sin respuestas => ruido (umbral adaptativo)
  herencia_profundidad_max: 10
  origen_ventana_h: 3                       # tolerancia del puntaje = 3 h
  origen_minimo: 5

coordinacion:
  ventana_min: 30                           # E17: ráfaga alineada (misma publicación + narrativa + postura)
  min_sincronias: 3                         # "las mismas cuentas juntas, una y otra vez"
  min_sincronia_norm: 0.2                   # fracción de publicaciones de la cuenta menos activa
  min_tamano: 5
  min_densidad: 0.3

llm:
  proveedor: null                           # null = tomar de LLM_PROVIDER (.env); sin clave => respaldo
  temperatura: 0
  max_concurrencia: 16
  timeout_s: 30
  reintentos: 4
  cache_dir: cache/llm                      # se commitea: permite re-correr sin clave

duckdb:
  memory_limit: 4GB
